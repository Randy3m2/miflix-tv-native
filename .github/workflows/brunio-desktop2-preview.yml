# Builds the isolated BruniO Desktop2 integration candidate on the pinned UI.
# Account/device acceptance remains required. Never publish to pc-latest automatically.
name: BruniO Desktop 2.2.7 Sports Cards and Multiview

on:
  pull_request:
    paths:
      - 'desktop/brunio-desktop2/**'
      - '.github/workflows/brunio-desktop2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop2-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ui-preflight:
    name: BruniO Windows Compose + integration validation
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      NUVIO_DESKTOP_VERSION_NAME: 2.2.7
      NUVIO_DESKTOP_VERSION_CODE: "227"
      WEBVIEW2_VERSION: "1.0.4078.44"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python image tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      # Reuse ONLY the Windows libmpv DLL from our previously successful
      # BruniO 2.0.2 MSI; the preparation script verifies its SHA-256 against
      # the original pinned Nuvio Git LFS object before loading it.
      - name: Retrieve pinned Windows runtime from verified BruniO 2.0.2 MSI
        uses: actions/download-artifact@v4
        with:
          name: BruniO-Desktop2-v2.0.2-Home-Playback-Hotfix
          run-id: 43226541574
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _brunio_runtime_seed

      - name: Extract native Windows runtime from verified MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "_brunio_runtime_seed" -Recurse -File -Filter "BruniO-Windows-*.msi" | Select-Object -First 1
          if ($null -eq $msi) { throw 'Verified BruniO 2.0.2 MSI artifact unavailable' }
          $target = Join-Path $env:RUNNER_TEMP "brunio_msi_admin_extract"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $args = @('/a', ('"' + $msi.FullName + '"'), '/qn', ('TARGETDIR="' + $target + '"'))
          $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
          # The official Nuvio Windows packager embeds native/windows/libmpv-2.dll
          # INSIDE composeApp-desktop-*.jar (not as a loose MSI file).
          $appJar = Get-ChildItem $target -Recurse -File -Filter "composeApp-desktop-*.jar" | Select-Object -First 1
          if ($null -eq $appJar) { throw 'Verified MSI has no Compose Desktop application JAR' }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($appJar.FullName)
          $copy = Join-Path $env:RUNNER_TEMP 'brunio-pinned-libmpv-2.dll'
          try {
            $entry = $archive.GetEntry("native/windows/libmpv-2.dll")
            if ($null -eq $entry -or $entry.Length -lt 1000000) {
              throw 'Verified MSI JAR lacks native/windows/libmpv-2.dll'
            }
            $stream = [System.IO.File]::Create($copy)
            try {
              $inputStream = $entry.Open()
              try { $inputStream.CopyTo($stream) }
              finally { $inputStream.Dispose() }
            } finally { $stream.Dispose() }
          } finally { $archive.Dispose() }
          "BRUNIO_DESKTOP2_MPV_FALLBACK=$copy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Native Windows libmpv recovered from pinned BruniO MSI JAR ($((Get-Item $copy).Length) bytes)."

      - name: Prepare pinned Nuvio UI with BruniO overlay
        shell: pwsh
        run: |
          git lfs install
          python desktop/brunio-desktop2/tools/prepare_nuvio.py --output _brunio_desktop2_build
          if ($LASTEXITCODE -ne 0) { throw 'Could not pin or patch Nuvio upstream' }
          $runtime="_brunio_desktop2_build/composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if (!(Test-Path $runtime)) { throw 'Missing Windows libmpv runtime' }
          if ((Get-Item $runtime).Length -lt 1000000) { throw 'Windows native player is a Git LFS pointer, not a valid DLL' }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install WebView2 C++ development SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP/nuget" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 NuGet install failed' }
          $root = Join-Path $env:RUNNER_TEMP "nuget/Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (!(Test-Path "$root/build/native/x64/WebView2Loader.dll.lib")) { throw 'WebView2 import library unavailable' }
          "BRUNIO_WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile Compose Desktop and run BruniO compatibility tests
        working-directory: _brunio_desktop2_build
        shell: pwsh
        run: |
          ./gradlew.bat :composeApp:desktopTest :composeApp:compileKotlinDesktop --stacktrace --no-daemon --no-configuration-cache "-Pnuvio.webview2.dir=$env:BRUNIO_WEBVIEW2_ROOT" "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8"
          if ($LASTEXITCODE -ne 0) { throw 'Compose Desktop compilation or tests failed' }

      - name: Package BruniO Windows validation MSI
        working-directory: _brunio_desktop2_build
        shell: pwsh
        run: |
          ./gradlew.bat :composeApp:packageReleaseMsi --stacktrace --no-daemon --no-configuration-cache "-Pnuvio.webview2.dir=$env:BRUNIO_WEBVIEW2_ROOT" "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8"
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSI package failed' }
          $msi = Get-ChildItem "composeApp/build/compose/release-msis" -Filter "BruniO-Windows-*.msi" | Select-Object -First 1
          if ($null -eq $msi) { throw 'BruniO integration MSI missing' }
          Write-Host "BruniO integration candidate: $($msi.FullName)"

      - name: Upload BruniO Windows integration candidate
        uses: actions/upload-artifact@v4
        with:
          name: BruniO-Desktop-v2.2.7-SPORTS-MULTIVIEW
          path: _brunio_desktop2_build/composeApp/build/compose/release-msis/BruniO-Windows-*.msi
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BruniO-Desktop2-Test-Reports
          path: |
            _brunio_desktop2_build/composeApp/build/reports/tests/desktopTest/**
            _brunio_desktop2_build/composeApp/build/test-results/desktopTest/**
          if-no-files-found: warn
          retention-days: 7
