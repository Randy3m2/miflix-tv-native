name: Build EPG guide

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

concurrency:
  group: build-epg
  cancel-in-progress: true

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get iptv-org/epg
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git /tmp/epg
          cd /tmp/epg && npm install
      - name: Build channel lists (one file per source site)
        run: python3 scripts/build_channels.py /tmp/epg /tmp/epg/channels
      - name: Download schedules (one process per site)
        working-directory: /tmp/epg
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          mkdir -p guides
          for f in channels/*.channels.xml; do
            site=$(basename "$f" .channels.xml)
            echo "=== $site ($(grep -c '<channel ' "$f") channels)"
            timeout 25m npx tsx scripts/commands/epg/grab.ts --channels="$f" --days=3 --maxConnections=5 --timeout=30000 --output="guides/$site.xml" > "guides/$site.log" 2>&1 || echo "  $site finished with errors"
            tail -n 3 "guides/$site.log"
          done
          ls -la guides/*.xml
      - name: Merge and shrink to app limit
        run: |
          python3 scripts/shrink_guide.py /tmp/epg/guides /tmp/guide.xml
          grep -o "<programme " /tmp/guide.xml | wc -l
      - name: Publish guide.xml (single-commit branch epg-data)
        run: |
          mkdir /tmp/pub && cp /tmp/guide.xml /tmp/pub/guide.xml
          cd /tmp/pub
          git init -q -b epg-data
          git config user.name "epg-bot"; git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml && git commit -q -m "EPG $(date -u +%F\ %H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" epg-data
