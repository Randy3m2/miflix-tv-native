name: Build MiFlix Native TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MIFLIX_TMDB_TOKEN: ${{ secrets.MIFLIX_TMDB_TOKEN }}
      MIFLIX_TORRENTIO_MANIFEST: ${{ secrets.MIFLIX_TORRENTIO_MANIFEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiFlix-TV-Native-v2.0.0-alpha1.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiFlix-TV-Native-v2.0.0-alpha1.1
          path: MiFlix-TV-Native-v2.0.0-alpha1.1.apk

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="native-v2.0.0-alpha1.1"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${GITHUB_SHA}" --title "MiFlix TV Native 2.0 Alpha 1.1" --notes "Native Android TV build. Dependency compatibility fix for compileSdk 36 / AGP 8.13."
          gh release upload "$TAG" MiFlix-TV-Native-v2.0.0-alpha1.1.apk --clobber
