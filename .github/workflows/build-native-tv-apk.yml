name: Build MiFlix Native TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brunio-native-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MIFLIX_TMDB_TOKEN: ${{ secrets.MIFLIX_TMDB_TOKEN }}
      MIFLIX_SIGNING_KEYSTORE_BASE64: ${{ secrets.MIFLIX_SIGNING_KEYSTORE_BASE64 }}
      MIFLIX_SIGNING_STORE_PASSWORD: ${{ secrets.MIFLIX_SIGNING_STORE_PASSWORD }}
      MIFLIX_SIGNING_KEY_ALIAS: ${{ secrets.MIFLIX_SIGNING_KEY_ALIAS }}
      MIFLIX_SIGNING_KEY_PASSWORD: ${{ secrets.MIFLIX_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent private signing key
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          names=['MIFLIX_SIGNING_KEYSTORE_BASE64','MIFLIX_SIGNING_STORE_PASSWORD','MIFLIX_SIGNING_KEY_ALIAS','MIFLIX_SIGNING_KEY_PASSWORD']
          missing=[name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure these repository Actions secrets first: '+', '.join(missing)+'. See RC17_SETUP.md.')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'brunio-signing.p12'
          path.write_bytes(base64.b64decode(os.environ[names[0]],validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('MIFLIX_SIGNING_KEYSTORE_PATH='+str(path)+'\n')
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and build permanently signed APK
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Verify signing and prepare APKs and update metadata
        run: python3 scripts/prepare_update.py app/build/outputs/apk/release/app-release.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiFlix-TV-Native-v2.0.0-rc19
          path: |
            MiFlix-TV-Native-v2.0.0-rc19.apk
            update.json

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="native-v2.0.0-rc19"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${GITHUB_SHA}" --title "MiFlix TV Native 2.0 RC19" --notes "RC19: visible random playback, size/year source filters, party lifecycle fixes and Joined notice, extra avatars and QR photo upload."
          gh release upload "$TAG" MiFlix-TV-Native-v2.0.0-rc19.apk update.json --clobber

      - name: Update permanent latest channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="native-latest"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${GITHUB_SHA}" --title "MiFlix TV Native · Latest" --notes "Current version: 2.0.0-rc19"
          gh release upload "$TAG" MiFlix-TV-Native.apk update.json --clobber
          gh release edit "$TAG" --title "MiFlix TV Native · Latest" --notes "Current version: 2.0.0-rc19"

      - name: Remove runner copy of private signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/brunio-signing.p12"
