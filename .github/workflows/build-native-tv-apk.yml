name: Build MiFlix Native TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MIFLIX_TMDB_TOKEN: ${{ secrets.MIFLIX_TMDB_TOKEN }}
      MIFLIX_TORRENTIO_MANIFEST: ${{ secrets.MIFLIX_TORRENTIO_MANIFEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MiFlix-TV-Native-v2.0.0-rc13.apk
          cp app/build/outputs/apk/debug/app-debug.apk MiFlix-TV-Native.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiFlix-TV-Native-v2.0.0-rc13
          path: MiFlix-TV-Native-v2.0.0-rc13.apk

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="native-v2.0.0-rc13"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${GITHUB_SHA}" --title "MiFlix TV Native 2.0 RC13" --notes "RC13: stable keyed video surface, Compose SurfaceView sync workaround, bounded subtitle startup wait and faster rebuffering."
          gh release upload "$TAG" MiFlix-TV-Native-v2.0.0-rc13.apk --clobber

      - name: Update permanent latest channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="native-latest"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${GITHUB_SHA}" --title "MiFlix TV Native · Latest" --notes "Current version: 2.0.0-rc13"
          gh release edit "$TAG" --title "MiFlix TV Native · Latest" --notes "Current version: 2.0.0-rc13"
          gh release upload "$TAG" MiFlix-TV-Native.apk --clobber
