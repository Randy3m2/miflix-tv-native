name: Build BruniO PC Preview (no release)
on:
  push:
    branches:
      - feature/pc-rc9-visual-performance
    paths:
      - 'desktop/brunio-pc/**'
      - '.github/workflows/build-pc-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: desktop/brunio-pc
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/brunio-pc/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: |
          python -m compileall -q brunio scripts tests main.py
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Qt tests failed' }
          python main.py --smoke
          if ($LASTEXITCODE -ne 0) { throw 'UI smoke failed' }
      - name: Build Windows preview installer
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BruniO-PC-RC9-preview-installer
          path: |
            desktop/brunio-pc/installer/BruniO-PC-Setup-1.0.0-rc9.exe
            desktop/brunio-pc/installer/pc-update.json
          retention-days: 7
