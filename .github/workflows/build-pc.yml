name: Build BruniO PC Windows
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brunio-pc-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/brunio-pc
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/brunio-pc/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python main.py --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Qt smoke test failed' }
      - name: Read PC version
        id: pc_version
        run: |
          $version = (python -c 'from brunio import VERSION; print(VERSION)').Trim()
          if (-not $version) { throw 'PC version is empty' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "value=$version"
      - name: Build installer
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: BruniO-PC-Windows-${{ steps.pc_version.outputs.value }}
          path: desktop/brunio-pc/installer/*
      - name: Publish PC channel
        env:
          GH_TOKEN: ${{ github.token }}
          PC_VERSION: ${{ steps.pc_version.outputs.value }}
        run: |
          $version = $env:PC_VERSION
          $tag = "pc-v$version"
          $installer = "installer/BruniO-PC-Setup-$version.exe"
          if (-not (Test-Path $installer)) {
            Get-ChildItem installer -ErrorAction SilentlyContinue | Select-Object Name
            throw "PC installer not found: $installer"
          }
          if (-not (Test-Path 'installer/pc-update.json')) { throw 'PC update metadata not found' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --target $env:GITHUB_SHA --title "BruniO PC $version" --notes 'Windows x64 client; TV-compatible Watch Party, profiles, catalogs and VLC playback.' }
          if ($LASTEXITCODE -ne 0) { throw 'PC release failed' }
          gh release upload $tag $installer installer/pc-update.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'PC version upload failed' }
          gh release view pc-latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create pc-latest --target $env:GITHUB_SHA --title 'BruniO PC · Latest' --notes "Windows x64 current version: $version" }
          if ($LASTEXITCODE -ne 0) { throw 'PC latest release failed' }
          gh release edit pc-latest --notes "Windows x64 current version: $version"
          if ($LASTEXITCODE -ne 0) { throw 'PC latest description failed' }
          gh release upload pc-latest installer/pc-update.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'PC metadata upload failed' }
