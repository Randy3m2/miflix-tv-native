name: Build BruniO PC Windows
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brunio-pc-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/brunio-pc
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/brunio-pc/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python main.py --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Qt smoke test failed' }
      - name: Build installer
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BruniO-PC-Windows-RC1
          path: desktop/brunio-pc/installer/*
      - name: Publish PC channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'pc-v1.0.0-rc1'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --target $env:GITHUB_SHA --title 'BruniO PC 1.0 RC1' --notes 'Windows x64 client; TV-compatible Watch Party, profiles, catalogs and VLC playback.' }
          if ($LASTEXITCODE -ne 0) { throw 'PC release failed' }
          gh release upload $tag installer/BruniO-PC-Setup-1.0.0-rc1.exe installer/pc-update.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'PC version upload failed' }
          gh release view pc-latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create pc-latest --target $env:GITHUB_SHA --title 'BruniO PC · Latest' --notes 'Windows x64 current version: 1.0.0-rc1' }
          if ($LASTEXITCODE -ne 0) { throw 'PC latest release failed' }
          gh release upload pc-latest installer/pc-update.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'PC metadata upload failed' }
