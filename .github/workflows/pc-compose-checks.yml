name: BruniO PC Compose Checks (development)
on:
  pull_request:
    paths:
      - desktop/brunio-pc-next/**
      - .github/workflows/pc-compose-checks.yml
  workflow_dispatch:
    inputs:
      publish_pc:
        description: 'Publish this verified PC build and update the PC update channel'
        type: boolean
        required: false
        default: false
  push:
    branches: [codex/brunio-pc-compose-rebuild]
    paths:
      - desktop/brunio-pc-next/**
      - .github/workflows/pc-compose-checks.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check local protocol bridge
        run: python -m unittest discover -s desktop/brunio-pc-next/tests -v
      - name: Download and verify Gradle
        shell: pwsh
        run: |
          $gradleVersion = '8.14.3'
          $gradleUrl = "https://services.gradle.org/distributions/gradle-$gradleVersion-bin.zip"
          Invoke-WebRequest $gradleUrl -OutFile "$env:RUNNER_TEMP/gradle.zip"
          $expected = (Invoke-RestMethod "$gradleUrl.sha256").Trim()
          $actual = (Get-FileHash "$env:RUNNER_TEMP/gradle.zip" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Gradle checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/gradle.zip" -DestinationPath "$env:RUNNER_TEMP/gradle"
          "$env:RUNNER_TEMP/gradle/gradle-$gradleVersion/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare native VLC test
        shell: pwsh
        run: |
          $vlcUrl = 'https://downloads.videolan.org/videolan/vlc/3.0.23/win64/vlc-3.0.23-win64.zip'
          Invoke-WebRequest $vlcUrl -OutFile "$env:RUNNER_TEMP/vlc.zip"
          $expected = ((Invoke-RestMethod "$vlcUrl.sha256").Trim() -split '\s+')[0]
          if ((Get-FileHash "$env:RUNNER_TEMP/vlc.zip" -Algorithm SHA256).Hash -ne $expected) { throw 'VLC checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/vlc.zip" -DestinationPath "$env:RUNNER_TEMP/vlc"
          $vlcHome = "$env:RUNNER_TEMP/vlc/vlc-3.0.23"
          "BRUNIO_VLC_HOME=$vlcHome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VLC_PLUGIN_PATH=$vlcHome/plugins" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $vlcHome | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          python desktop/brunio-pc-next/scripts/create_video_fixture.py "$env:RUNNER_TEMP/brunio-test.avi"
          if ($LASTEXITCODE -ne 0) { throw 'Video fixture failed' }
          "BRUNIO_SMOKE_MEDIA=$env:RUNNER_TEMP/brunio-test.avi" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile interface and test navigation
        working-directory: desktop/brunio-pc-next/compose
        run: gradle --no-daemon test compileKotlin
      - name: Build and smoke-test self-contained PC preview
        shell: pwsh
        run: desktop/brunio-pc-next/scripts/build_windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: BruniO-PC-Compose-Preview-${{ github.sha }}
          path: desktop/brunio-pc-next/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: BruniO-PC-UI-Review-${{ github.sha }}
          path: desktop/brunio-pc-next/ui-review/*
          if-no-files-found: warn

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pc
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and publish verified PC installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:GITHUB_RUN_ID --name "BruniO-PC-Compose-Preview-$env:GITHUB_SHA" --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download verified build' }
          $metadata = Get-Content release/pc-update.json -Raw | ConvertFrom-Json
          if ($metadata.version -notmatch '^2\.0\.0-rc\d+$' -or $metadata.channel -ne 'pc-windows-x64') { throw 'Invalid PC channel' }
          $tag = 'pc-v' + $metadata.version
          $name = 'BruniO-PC-Setup-' + $metadata.version + '.exe'
          $exe = Join-Path release $name
          $expectedUrl = 'https://github.com/' + $env:GITHUB_REPOSITORY.ToLowerInvariant() + '/releases/download/' + $tag + '/' + $name
          if ($metadata.downloadUrl.ToLowerInvariant() -ne $expectedUrl.ToLowerInvariant()) { throw 'Unexpected installer destination' }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $metadata.sha256 -or (Get-Item $exe).Length -ne $metadata.sizeBytes) { throw 'Installer integrity failed' }
          gh release create $tag $exe --target $env:GITHUB_SHA --prerelease --latest=false --title "BruniO PC $($metadata.version)" --notes 'Windows x64 PC build. Includes Java, VLC and the local service. TV and mobile are unchanged.'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish immutable PC release' }
          gh release view pc-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create pc-latest --target $env:GITHUB_SHA --prerelease --latest=false --title 'BruniO PC update channel' --notes 'PC installer update metadata.'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create PC channel' }
          }
          gh release upload pc-latest release/pc-update.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot update PC metadata' }
