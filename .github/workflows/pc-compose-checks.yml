name: BruniO PC Compose Checks (development)
on:
  pull_request:
    paths:
      - desktop/brunio-pc-next/**
      - .github/workflows/pc-compose-checks.yml
  workflow_dispatch:
  push:
    branches: [codex/brunio-pc-compose-rebuild]
    paths:
      - desktop/brunio-pc-next/**
      - .github/workflows/pc-compose-checks.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check local protocol bridge
        run: python -m unittest discover -s desktop/brunio-pc-next/tests -v
      - name: Download and verify Gradle
        shell: pwsh
        run: |
          $gradleVersion = '8.14.3'
          $gradleUrl = "https://services.gradle.org/distributions/gradle-$gradleVersion-bin.zip"
          Invoke-WebRequest $gradleUrl -OutFile "$env:RUNNER_TEMP/gradle.zip"
          $expected = (Invoke-RestMethod "$gradleUrl.sha256").Trim()
          $actual = (Get-FileHash "$env:RUNNER_TEMP/gradle.zip" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Gradle checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/gradle.zip" -DestinationPath "$env:RUNNER_TEMP/gradle"
          "$env:RUNNER_TEMP/gradle/gradle-$gradleVersion/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare native VLC test
        shell: pwsh
        run: |
          $vlcUrl = 'https://downloads.videolan.org/videolan/vlc/3.0.23/win64/vlc-3.0.23-win64.zip'
          Invoke-WebRequest $vlcUrl -OutFile "$env:RUNNER_TEMP/vlc.zip"
          $expected = ((Invoke-RestMethod "$vlcUrl.sha256").Trim() -split '\s+')[0]
          if ((Get-FileHash "$env:RUNNER_TEMP/vlc.zip" -Algorithm SHA256).Hash -ne $expected) { throw 'VLC checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/vlc.zip" -DestinationPath "$env:RUNNER_TEMP/vlc"
          $vlcHome = "$env:RUNNER_TEMP/vlc/vlc-3.0.23"
          "BRUNIO_VLC_HOME=$vlcHome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VLC_PLUGIN_PATH=$vlcHome/plugins" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $vlcHome | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          python desktop/brunio-pc-next/scripts/create_video_fixture.py "$env:RUNNER_TEMP/brunio-test.avi"
          if ($LASTEXITCODE -ne 0) { throw 'Video fixture failed' }
          "BRUNIO_SMOKE_MEDIA=$env:RUNNER_TEMP/brunio-test.avi" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile interface and test navigation
        working-directory: desktop/brunio-pc-next/compose
        run: gradle --no-daemon test compileKotlin
      - name: Build and smoke-test self-contained PC preview
        shell: pwsh
        run: desktop/brunio-pc-next/scripts/build_windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: BruniO-PC-Compose-Preview-${{ github.sha }}
          path: desktop/brunio-pc-next/installer/BruniO-PC-Setup-2.0.0-rc1.exe
          if-no-files-found: error
