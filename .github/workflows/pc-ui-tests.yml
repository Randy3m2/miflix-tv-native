name: BruniO PC UI Tests
on:
  pull_request:
    paths:
      - 'desktop/brunio-pc/**'
      - '.github/workflows/pc-ui-tests.yml'
  push:
    branches:
      - 'feature/pc-rc9-visual-performance'
    paths:
      - 'desktop/brunio-pc/**'
      - '.github/workflows/pc-ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-qt:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: desktop/brunio-pc
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/brunio-pc/requirements.txt
      - name: Install Qt desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q brunio scripts tests main.py
      - name: Run desktop UI and protocol tests
        run: python -m unittest discover -s tests -v
      - name: Launch Qt smoke mode
        run: python main.py --smoke
