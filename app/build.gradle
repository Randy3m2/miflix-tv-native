plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def esc = { String s -> (s ?: '').replace('\\', '\\\\').replace('"', '\\"') }
def tmdbToken = System.getenv('MIFLIX_TMDB_TOKEN') ?: ''
def torrentioManifest = System.getenv('MIFLIX_TORRENTIO_MANIFEST') ?: ''

android {
    namespace 'com.miflix.native2'
    compileSdk 36

    defaultConfig {
        applicationId 'com.miflix.native2'
        minSdk 23
        targetSdk 36
        versionCode 22002
        versionName '2.0.0-rc4'

        buildConfigField 'String', 'SUPABASE_URL', '"https://iwvhigqxsvvgyzdygiqa.supabase.co"'
        buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_TdzEQXtDadVMKhSLVe0ihw_EAQ4iNsd"'
        buildConfigField 'String', 'MIFLIX_TMDB_TOKEN', '"' + esc(tmdbToken) + '"'
        buildConfigField 'String', 'MIFLIX_TORRENTIO_MANIFEST', '"' + esc(torrentioManifest) + '"'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    // Keep the native TV alpha on the API 36 / AGP 8.13 line.
    // Compose 1.12+ and Coil 3.6+ require compileSdk 37 / AGP 9.1+.
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.compose.ui:ui:1.11.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.11.4'
    implementation 'androidx.compose.foundation:foundation:1.11.4'
    implementation 'androidx.compose.animation:animation:1.11.4'
    implementation 'androidx.tv:tv-material:1.1.0'

    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    implementation 'io.coil-kt.coil3:coil-compose:3.5.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.5.0'
    implementation 'io.coil-kt.coil3:coil-gif:3.5.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.google.zxing:core:3.5.3'

    debugImplementation 'androidx.compose.ui:ui-tooling:1.11.4'
}
