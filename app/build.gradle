plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def esc = { String s -> (s ?: '').replace('\\', '\\\\').replace('"', '\\"') }
def tmdbToken = System.getenv('MIFLIX_TMDB_TOKEN') ?: ''
def signingPath = System.getenv('MIFLIX_SIGNING_KEYSTORE_PATH')
def signingPassword = System.getenv('MIFLIX_SIGNING_STORE_PASSWORD')
def signingAlias = System.getenv('MIFLIX_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('MIFLIX_SIGNING_KEY_PASSWORD')
def hasStableSigning = [signingPath, signingPassword, signingAlias, signingKeyPassword].every { it }


android {
    namespace 'com.miflix.native2'
    compileSdk 36

    defaultConfig {
        applicationId 'com.miflix.native2'
        minSdk 23
        targetSdk 36
        versionCode 22017
        versionName '2.0.0-rc19'

        buildConfigField 'String', 'SUPABASE_URL', '"https://iwvhigqxsvvgyzdygiqa.supabase.co"'
        buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_TdzEQXtDadVMKhSLVe0ihw_EAQ4iNsd"'
        buildConfigField 'String', 'MIFLIX_TMDB_TOKEN', '"' + esc(tmdbToken) + '"'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        stable {
            if (hasStableSigning) {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if ((graph.hasTask(':app:assembleRelease') || graph.hasTask(':app:bundleRelease')) && !hasStableSigning) {
        throw new GradleException('Stable signing is required. Configure the four MIFLIX_SIGNING secrets; see RC17_SETUP.md.')
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    // Keep the native TV alpha on the API 36 / AGP 8.13 line.
    // Compose 1.12+ and Coil 3.6+ require compileSdk 37 / AGP 9.1+.
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.compose.ui:ui:1.11.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.11.4'
    implementation 'androidx.compose.foundation:foundation:1.11.4'
    implementation 'androidx.compose.animation:animation:1.11.4'
    implementation 'androidx.tv:tv-material:1.1.0'

    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    implementation 'io.coil-kt.coil3:coil-compose:3.5.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.5.0'
    implementation 'io.coil-kt.coil3:coil-gif:3.5.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.11.4'
}
