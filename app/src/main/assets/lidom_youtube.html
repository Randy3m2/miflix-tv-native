<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><style>html,body,#player{width:100%;height:100%;margin:0;background:#000;overflow:hidden}</style></head><body><div id="player"></div><script>
var player;function report(v){if(window.BruniO)BruniO.status(v);}
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{videoId:'__VIDEO_ID__',playerVars:{origin:'__ORIGIN__',autoplay:1,controls:1,playsinline:1,fs:0,loop:0},events:{onReady:function(){report('ready');},onStateChange:function(e){if(e.data===1)report('playing');},onError:function(e){report('error:'+e.data);},onAutoplayBlocked:function(){report('blocked');}}});}
function brunioPlayPause(){if(player&&player.getPlayerState){if(player.getPlayerState()===1)player.pauseVideo();else player.playVideo();}}
function brunioPause(){if(player&&player.pauseVideo)player.pauseVideo();}
function brunioSeek(delta){if(player&&player.getCurrentTime)player.seekTo(Math.max(0,player.getCurrentTime()+delta),true);}
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
