<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BruniO · TV catalog</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:white;font:15px system-ui}iframe{width:100%;height:100dvh;border:0;display:block}#status{position:fixed;z-index:2;bottom:16px;left:16px;right:16px;max-width:640px;background:#18111fee;border:1px solid #b792ff;border-radius:14px;padding:16px}#status:empty{display:none}</style></head><body><iframe id="catalog" title="BruniO catalog" referrerpolicy="no-referrer" allow="fullscreen"></iframe><p id="status" role="status"></p><script>
'use strict';
const endpoint='__BRUNIO_ENDPOINT__',ticket='__BRUNIO_LINK_TICKET__',webOrigin='https://miflix-tv-native-web.vercel.app',frame=document.getElementById('catalog'),status=document.getElementById('status');let token='',connected=false;
// No token, account password or pairing capability is sent to the embedded website.
const connect=fetch('/connect',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({ticket})}).then(async r=>{if(!r.ok)throw Error('This TV link expired. Open Connect phone / PC on the TV for a new link.');token=(await r.json()).token;connected=true;status.textContent='';return true;}).catch(e=>{status.textContent=e.message;return false;});
frame.src=webOrigin+'/#tv='+encodeURIComponent(endpoint)+'&bridge=1';
function respond(data){frame.contentWindow.postMessage({brunio:'tv-bridge',...data},webOrigin);}
window.addEventListener('message',async event=>{
 if(event.origin!==webOrigin||event.source!==frame.contentWindow||event.data?.brunio!=='tv-client')return;
 const data=event.data;
 if(data.action==='disconnect'){token='';connected=false;return;}
 if(data.action==='ready'){if(await connect)respond({connected:true});return;}
 if(data.action!=='send'||!/^[-a-z0-9]{8,80}$/i.test(data.id||''))return;
 if(!await connect||!connected){respond({id:data.id,ok:false,error:'TV connection expired. Open a fresh TV link.'});return;}
 const input=data.payload||{};
 if(!/^tmdb:(movie|series):[1-9][0-9]{0,8}$/.test(input.cloud||'')||!['details','play'].includes(input.action)){respond({id:data.id,ok:false,error:'Invalid title.'});return;}
 try{const r=await fetch('/send',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded',Authorization:'Bearer '+token},body:new URLSearchParams({cloud:input.cloud,action:input.action,season:input.season||'1',episode:input.episode||'1',request:data.id})});if(!r.ok)throw Error('TV connection unavailable. Open a new TV link.');respond({id:data.id,ok:true});}catch(e){respond({id:data.id,ok:false,error:e.message});}
});
</script></body></html>
