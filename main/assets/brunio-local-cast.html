<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BruniO · Send to TV</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,520px);background:#141414;border:1px solid #34303c;border-radius:28px;padding:30px}h1{font-size:30px;margin:8px 0}p{color:#b9b5c2;line-height:1.5}label{display:block;margin-top:16px}input,button{font:inherit;border-radius:30px;padding:14px 18px;width:100%;margin-top:8px;border:1px solid #544765;color:white;background:#201a2c}button{cursor:pointer;background:#b792ff;color:#100c16;font-weight:700}button:disabled{opacity:.45}input:focus,button:focus{outline:2px solid #b792ff}small{color:#aaa}.row{display:flex;gap:12px}#status{min-height:48px;overflow-wrap:anywhere}a{color:#b792ff}.eyebrow{color:#b792ff;letter-spacing:.15em;font-size:12px}</style><main><p class="eyebrow">BRUNIO · LOCAL WI-FI</p><h1>Send to TV</h1><p>Choose a title on your BruniO website, then use its “Open local controller” button. Playback stays on your TV.</p><form id="pair"><label>TV connection code<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="off"></label><button>Connect</button></form><section id="send" hidden><p id="title"></p><label>TMDB title ID<input id="cloud" placeholder="tmdb:movie:12345" pattern="tmdb:(movie|series):[1-9][0-9]{0,8}" required></label><div class="row"><label>Season<input id="season" type="number" min="1" max="10000" value="1"></label><label>Episode<input id="episode" type="number" min="1" max="10000" value="1"></label></div><button id="details">Open details on TV</button><button id="play">Play on TV</button><button id="disconnect">Disconnect this browser</button></section><p id="status" role="status"></p><small>Same home Wi-Fi only. Keep BruniO open. Use your remote for playback controls. No video plays on this page.</small></main><script>
'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.hash.slice(1));let token=sessionStorage.getItem('brunio-local-token')||'';const initial=params.get('cloud');if(initial&&/^tmdb:(movie|series):[1-9][0-9]{0,8}$/.test(initial))$('cloud').value=initial;$('code').value=/^\d{6}$/.test(params.get('code')||'')?params.get('code'):'';$('title').textContent=(params.get('title')||'').slice(0,200);history.replaceState(null,'',location.pathname);function connected(){ $('pair').hidden=!!token;$('send').hidden=!token;}connected();async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded',...(token?{Authorization:'Bearer '+token}:{})},body:new URLSearchParams(data)});if(!r.ok){if(r.status===401){token='';sessionStorage.removeItem('brunio-local-token');connected();}throw Error('Connection failed. Generate a new TV code and reconnect.');}return r.json();}$('pair').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const result=await post('/connect',{code:$('code').value});token=result.token;sessionStorage.setItem('brunio-local-token',token);connected();$('status').textContent='Connected to your TV.';}catch(e){$('status').textContent=e.message;}finally{b.disabled=false;}};async function send(action){if(!$('cloud').reportValidity()||!$('season').reportValidity()||!$('episode').reportValidity())return;const buttons=[$('details'),$('play')];buttons.forEach(b=>b.disabled=true);try{await post('/send',{cloud:$('cloud').value,action,season:$('season').value,episode:$('episode').value,request:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)});$('status').textContent='Sent. Check your TV.';}catch(e){$('status').textContent=e.message;}finally{buttons.forEach(b=>b.disabled=false);}}$('details').onclick=()=>send('details');$('play').onclick=()=>send('play');$('disconnect').onclick=()=>{token='';sessionStorage.removeItem('brunio-local-token');connected();};
</script></html>
