<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#050505"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src https://*.torbox.app https://*.tb-cdn.cx https://*.tb-cdn.io https://*.tb-cdn.pw https://*.tb-cdn.sh https://*.tb-cdn.st https://*.tb-cdn.to https://*.tb-cdn.earth; img-src https://image.tmdb.org; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>BruniO · Player</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font:15px system-ui}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:clamp(18px,3vw,28px);margin:8px 0 18px;overflow-wrap:anywhere}.brand{color:#b792ff;font-size:12px;letter-spacing:3px}video{display:block;width:100%;max-height:72dvh;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:14px}#status{min-height:2.5em;line-height:1.6;color:#c5bad6}.actions{display:flex;flex-wrap:wrap;gap:10px}button,a{font:inherit;display:inline-block;padding:12px 18px;border:1px solid #ffffff2b;border-radius:30px;background:#18131f;color:white;text-decoration:none;cursor:pointer}.primary{background:#b792ff;color:#160c23;border:0;font-weight:700}small{display:block;color:#aaa;line-height:1.6;margin:20px 0}input{padding:12px;background:#15101d;color:white;border:1px solid #b792ff;width:100%}[hidden]{display:none!important}@media(max-width:600px){main{padding:12px}.actions>*{flex:1;text-align:center;font-size:12px}video{border-radius:8px}}video:fullscreen{width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important;border:0!important;margin:0!important;padding:0!important;object-fit:contain;background:#000;}video:-webkit-full-screen{width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important;border:0!important;margin:0!important;padding:0!important;object-fit:contain;background:#000;}</style></head>
<body><main><p class="brand">BRUNIO · WEB PLAYER</p><h1 id="title">BruniO</h1><video id="video" controls playsinline preload="metadata"></video><p id="status" role="status" aria-live="polite"></p><div class="actions"><button id="play" class="primary">▶ Play</button><button id="retry">Retry</button><button id="fullscreen">Fullscreen</button><a id="browser" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">Open in browser</a><a id="vlc" hidden>Open in VLC</a><a id="android" hidden>External player · online</a><button id="copy">Copy link</button></div><div id="manual"></div><small id="note"></small></main>
<script>
'use strict';
const params=new URLSearchParams(location.hash.slice(1)),es=params.get('lang')==='es',t=(en,spanish)=>es?spanish:en;
history.replaceState(null,'',location.pathname+location.search);
const $=id=>document.getElementById(id),video=$('video');let media='',disposed=false,waitTimer;
function allowed(raw){const u=new URL(raw);if(u.protocol!=='https:'||u.username||u.password||(u.port&&u.port!=='443')||u.hostname==='api.torbox.app'||!['torbox.app','tb-cdn.cx','tb-cdn.io','tb-cdn.pw','tb-cdn.sh','tb-cdn.st','tb-cdn.to','tb-cdn.earth'].some(domain=>u.hostname.endsWith('.'+domain)))throw Error('Invalid source');return u;}
function status(en,spanish){$('status').textContent=t(en,spanish);}
function clearWait(){clearTimeout(waitTimer);}
function cleanup(){if(disposed)return;disposed=true;clearWait();video.pause();video.removeAttribute('src');video.load();}
function waiting(){clearWait();waitTimer=setTimeout(()=>{if(!disposed)status('Still loading. Try another source or an external player if it does not start.','Todavía cargando. Prueba otra fuente o un reproductor externo si no empieza.');},15000);}
async function play(){if(!media||disposed)return;try{await video.play();}catch(e){if(disposed)return;if(e.name==='NotAllowedError')status('Tap the video’s Play button to start.','Pulsa Play en el vídeo para comenzar.');else status('The browser could not play this source. Use another source or the external options below.','El navegador no pudo reproducir esta fuente. Prueba otra fuente o las opciones externas de abajo.');}}
$('play').textContent=t('▶ Play','▶ Reproducir');$('retry').textContent=t('Retry','Reintentar');$('fullscreen').textContent=t('Fullscreen','Pantalla completa');$('browser').textContent=t('Open in browser','Abrir en navegador');$('copy').textContent=t('Copy link','Copiar enlace');
$('note').textContent=t('Streaming directly from TorBox. Browser codec/container support applies; no transcoding. Another website may have the same restrictions. Generated links are private. To watch offline, open a downloaded file in your device’s player.','Streaming directo desde TorBox. Depende de los formatos/códecs del navegador; no se convierte el vídeo. Otra web puede tener las mismas restricciones. Los enlaces generados son privados. Para verlo offline, abre el archivo descargado en el reproductor de tu dispositivo.');
try{
 media=allowed(params.get('src')||'').href;$('title').textContent=params.get('title')||'BruniO';document.documentElement.lang=es?'es':'en';
 const art=params.get('poster');if(art){try{const image=new URL(art);if(image.protocol==='https:'&&image.hostname==='image.tmdb.org')video.poster=image.href;}catch{}}
 $('browser').href=media;
 if(/iPad|iPhone|iPod/i.test(navigator.userAgent||'')||(/Mac/i.test(navigator.platform||'')&&Number(navigator.maxTouchPoints)>1)){$('vlc').hidden=false;$('vlc').href='vlc-x-callback://x-callback-url/stream?url='+encodeURIComponent(media);$('vlc').target='_top';}
 if(/Android/i.test(navigator.userAgent||'')){$('android').hidden=false;const u=allowed(media);u.hash='';$('android').href='intent:'+u.href.slice('https:'.length)+'#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;type=video/*;end';$('android').target='_top';}
 video.addEventListener('loadstart',()=>{status('Loading video…','Cargando vídeo…');waiting();});
 video.addEventListener('waiting',()=>{status('Buffering…','Cargando…');waiting();});
 video.addEventListener('playing',()=>{clearWait();status('Playing in BruniO.','Reproduciendo en BruniO.');});
 video.addEventListener('canplay',()=>{clearWait();status('Ready. Press Play if playback has not started.','Listo. Pulsa Play si no ha comenzado.');});
 video.addEventListener('error',()=>{clearWait();const code=video.error?.code;status(code===4?'Unsupported source/format in this browser. Choose another source or use VLC/an external player. [MEDIA_4]':code===3?'The browser could not decode this video or audio. Try another source. [MEDIA_3]':'Video unavailable, expired link or network error. Regenerate the link or try another source. [MEDIA_'+(code||0)+']',code===4?'Fuente/formato no compatible con este navegador. Prueba otra fuente o VLC/un player externo. [MEDIA_4]':code===3?'El navegador no pudo decodificar este vídeo o audio. Prueba otra fuente. [MEDIA_3]':'Vídeo no disponible, enlace caducado o error de red. Genera otro enlace o prueba otra fuente. [MEDIA_'+(code||0)+']');});
 video.autoplay=params.get('autoplay')==='1';video.src=media;
 const resume=Number(params.get('resume')||0);video.addEventListener('loadedmetadata',()=>{if(Number.isFinite(resume)&&resume>0&&Number.isFinite(video.duration)&&resume<video.duration-2)video.currentTime=resume;});
 status('Press Play to start streaming.','Pulsa Play para comenzar.');
}catch{status('Invalid or missing source. Return to the catalog and generate a fresh link.','Fuente inválida o ausente. Vuelve al catálogo y genera un enlace nuevo.');$('play').disabled=true;$('retry').disabled=true;$('browser').hidden=true;$('copy').hidden=true;}
$('play').onclick=play;
$('retry').onclick=()=>{if(media&&!disposed){video.load();play();}};
$('fullscreen').onclick=()=>{const fallback=()=>status('Use the fullscreen button in the video controls.','Usa el botón de pantalla completa del vídeo.');try{let result;if(video.requestFullscreen)result=video.requestFullscreen();else if(video.webkitRequestFullscreen)result=video.webkitRequestFullscreen();else if(video.webkitEnterFullscreen)result=video.webkitEnterFullscreen();else{fallback();return;}result?.catch(fallback);}catch{fallback();}};
$('copy').onclick=async()=>{if(!media)return;try{if(!navigator.clipboard)throw Error('No clipboard');await navigator.clipboard.writeText(media);status('Private media link copied.','Enlace privado copiado.');}catch{let input=$('manual').querySelector('input');if(!input){input=document.createElement('input');input.readOnly=true;input.setAttribute('aria-label',t('Private media link','Enlace privado'));$('manual').append(input);}input.value=media;input.focus();input.select();}};
function reportProgress(reason){if(!params.get('channel')||!window.parent||window.parent===window||!Number.isFinite(video.duration)||video.duration<=0)return;window.parent.postMessage({brunio:'web-progress',channel:params.get('channel'),position:video.currentTime,duration:video.duration,reason},location.origin);}
video.addEventListener('pause',()=>reportProgress('pause'));
video.addEventListener('ended',()=>reportProgress('ended'));
let progressTimer=setInterval(()=>{if(!disposed&&!video.paused)reportProgress('position');},10000);
window.addEventListener('pagehide',()=>{reportProgress('close');clearInterval(progressTimer);cleanup();});
window.addEventListener('pageshow',event=>{if(event.persisted&&disposed&&media){disposed=false;progressTimer=setInterval(()=>{if(!disposed&&!video.paused)reportProgress('position');},10000);video.autoplay=false;video.src=media;status('Press Play to resume.','Pulsa Play para reanudar.');}});
</script></body></html>
